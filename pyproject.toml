[project]
name = "greek-law"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angelos.toutsios", email = "angelos.toutsios@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
exclude = ["vault"]

[tool.ruff.lint]
select = ["E4","E7","E9","F","I","UP","B","N"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.poe.tasks]
test = "python -m pytest"

[tool.poe.tasks.typecheck]
help = "Static type check — the closest thing Python has to javac"
cmd = "mypy"

[tool.poe.tasks.lint]
help = "Report lint, formatting and type problems; changes nothing"
sequence = ["ruff check .", "ruff format --check .", { ref = "typecheck" }]
default_item_type = "cmd"

[tool.poe.tasks.format]
help = "Apply safe lint fixes and reformat"
sequence = ["ruff check --fix .", "ruff format ."]
default_item_type = "cmd"

[tool.pytest.ini_options]
testpaths = ["tests"]
