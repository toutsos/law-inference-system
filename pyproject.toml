[project]
name = "greek-law"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "angelos.toutsios", email = "angelos.toutsios@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4","E7","E9","F","I","UP","B","N"]



[tool.poe.tasks]
test = "python -m pytest"

[tool.poe.tasks.lint]
help = "Report lint and formatting problems; changes nothing"
sequence = ["ruff check .", "ruff format --check ."]
default_item_type = "cmd"

[tool.poe.tasks.format]
help = "Apply safe lint fixes and reformat"
sequence = ["ruff check --fix .", "ruff format ."]
default_item_type = "cmd"
