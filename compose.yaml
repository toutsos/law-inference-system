name: greek_law

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: greek_law
      POSTGRES_PASSWORD: greek_law
      POSTGRES_DB: greek_law
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greek_law -d greek_law"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata: